spring:
  application:
    name: ticket-system-api

  datasource:
    url: jdbc:mysql://localhost:3306/ticket_system
    username: YOUR_USER
    password: YOUR_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  mail:
    host: smtp.gmail.com
    port: 587
    username: MAIL_USERNAME
    password: MAIL_PASSWORD
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  mail:
    from: SoporteTickets@empresa.com

jwt:
  secret: "my-super-secret-key"
  expiration: "time token"

server:
    port: 8080